[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postdigital-optimizers"
version = "0.1.0"
description = "Library of black-box optimization algorithms benchmarked on energy efficiency, complexity and convergence performance"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["optimizers*", "experiments*"]
